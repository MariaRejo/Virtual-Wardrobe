{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 text-center mt-4">
        
        <img src="https://ui-avatars.com/api/?name={{ user.username }}&background=0D8ABC&color=fff&size=128" class="rounded-circle shadow mb-3">
        <h3 class="fw-bold">{{ user.username }}</h3>
        <p class="text-muted">Fashion Enthusiast</p>

        <div class="card-custom bg-white p-4 shadow-sm rounded-4 mt-4">
            <h5 class="fw-bold mb-4 text-start">Wardrobe Stats</h5>
            
            <div class="row g-3">
                <div class="col-4">
                    <div class="p-3 bg-light rounded-3">
                        <h2 class="fw-bold text-primary mb-0">{{ stats.tops }}</h2>
                        <small class="text-muted">Tops</small>
                    </div>
                </div>
                <div class="col-4">
                    <div class="p-3 bg-light rounded-3">
                        <h2 class="fw-bold text-success mb-0">{{ stats.pants }}</h2>
                        <small class="text-muted">Pants</small>
                    </div>
                </div>
                <div class="col-4">
                    <div class="p-3 bg-light rounded-3">
                        <h2 class="fw-bold text-warning mb-0">{{ stats.shoes }}</h2>
                        <small class="text-muted">Shoes</small>
                    </div>
                </div>
            </div>
            
            <div class="mt-3 p-3 bg-light rounded-3 d-flex justify-content-between">
                <span class="text-muted">Total Items</span>
                <span class="fw-bold">{{ stats.total }}</span>
            </div>
        </div>

        <a href="{{ url_for('logout') }}" class="btn btn-danger w-100 mt-4 py-3 rounded-pill fw-bold">
            Logout
        </a>
    </div>
</div>
{% endblock %}
