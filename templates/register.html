{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center align-items-center" style="height: 80vh;">
    <div class="col-md-5">
        <div class="card-custom p-4 p-md-5">
            <h4 class="fw-bold mb-2">Create Account 🚀</h4>
            <p class="text-muted mb-4">Join the Smart Fashion Revolution</p>
            
            <form action="{{ url_for('register') }}" method="POST">
                <div class="mb-3">
                    <label class="form-label fw-bold small text-muted">CHOOSE USERNAME</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                
                <div class="mb-4">
                    <label class="form-label fw-bold small text-muted">CREATE PASSWORD</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                
                <button type="submit" class="btn btn-success w-100 py-3 rounded-4 mb-3">
                    Sign Up
                </button>
            </form>

            <div class="text-center mt-3">
                <span class="text-muted">Already have an account? </span>
                <a href="{{ url_for('login') }}" class="fw-bold text-primary text-decoration-none">Login Here</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
